<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>streak</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #d9a56c;
      font-family: Tahoma, sans-serif;
      color: #5a3a1e;
    }

    .game {
      width: 100%;
      max-width: 390px;
      height: 700px;
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      border-radius: 30px;
      padding: 16px;
      background: linear-gradient(#f8dfb8, #eab883);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 18px;
    }
    .box {
      background: #fff3dc;
      border: 3px solid white;
      border-radius: 30px;
      padding: 8px 16px;
    }

    .center {
      margin: auto 0;
      text-align: center;
    }

    /* بطاقة الـ streak: كتبدا بيضاء وكتولي ذهبية ملي الرقم كيتبدل */
    .streak-card {
      padding: 30px 16px;
      margin-bottom: 14px;
      background-color: #fff3dc;
      border: 4px solid white;
      border-radius: 24px;
      transition: background-color 1s, box-shadow 1s;
    }
    .streak-card.hot {
      background-color: #ffd36b;
      box-shadow: 0 0 40px rgba(255, 201, 77, 0.9);
    }
    #num {
      font-size: 80px;
      font-weight: bold;
      line-height: 1.2;
    }

    /* الأزرار: كيبانو ملي كيتبدل الرقم */
    #buttons {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s;
    }
    #buttons.show { opacity: 1; pointer-events: auto; }

    .main-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      font-size: 20px;
      font-family: inherit;
      color: white;
      background: #c9742b;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* فوق theme.css: كيبقى النص كحل فالبطاقة */
    .streak-card {
      background-color: rgba(255, 255, 255, 0.86);
      color: #0b2a5b;
      text-shadow: none;
    }
    .streak-card.hot { background-color: #ffd36b; }
  </style>
</head>

<body>
  <div class="game">

    <!-- الشريط الفوقاني: نفس باقي الصفحات -->
    <div class="top">
      <div class="box">❤️ <span id="hearts">5</span></div>
      <div class="box" dir="ltr">💎 <span id="diamonds">0</span></div>
    </div>

    <div class="center">
      <div class="streak-card" id="card">
        <div id="num">Saliti</div>
      </div>

      <div id="buttons">
        <button class="main-btn" onclick="goMap()">رجوع للخريطة</button>
        <button class="main-btn" onclick="restartGame()">🔄 عاود اللعبة من الأول</button>
      </div>
    </div>
  </div>

  <script src="progress.js"></script>
  <script>
    // الكتابة اللي غادي تعوض الرقم (بدلها بأي كلمة بغيتي)
    const text = 'WAAA Sir T9ra';
    

    // كنبينو القلوب والألماس المحفوظين
    document.getElementById('hearts').textContent = getHearts();
    document.getElementById('diamonds').textContent = localStorage.getItem('diamonds') || 0;

    // بعد ثانية ونص: الرقم كيتبدل بالكتابة + البطاقة كتولي ذهبية + كيبانو الأزرار
    setTimeout(function () {
      const num = document.getElementById('num');
      num.textContent = text;
      num.style.fontSize = '56px';
      num.animate(
        [{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],
        {duration:500, easing:'ease-out'}
      );
      document.getElementById('card').classList.add('hot');
      document.getElementById('buttons').classList.add('show');
    }, 1500);

    // رجوع للخريطة: التقدم كيبقى كيف ما هو
    function goMap() {
      window.location.href = 'index.html';
    }

    // عاود من الأول: كنمسحو كلشي (الألماس 0، النجوم 0، القلوب 5)
    function restartGame() {
      resetProgress();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
